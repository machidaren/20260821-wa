<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title></title>
</head>

<body>
    <div id="app">
        <h1>アンケートフォーム</h1>

        <p>
            名前：
            <input type="text" v-model="name">
        </p>

        <p>
            年齢：
            <input type="number" v-model.number="age">
        </p>

        <p>
            性別：
            <label>
                <input type="radio" value="男性" v-model="gender">
                男性
            </label>

            <label>
                <input type="radio" value="女性" v-model="gender">
                女性
            </label>

            <label>
                <input type="radio" value="その他" v-model="gender">
                その他
            </label>
        </p>

        <p>興味のある分野：</p>

        <label>
            <input type="checkbox" value="HTML" v-model="skills">
            HTML
        </label>

        <label>
            <input type="checkbox" value="CSS" v-model="skills">
            CSS
        </label>

        <label>
            <input type="checkbox" value="JavaScript" v-model="skills">
            JavaScript
        </label>

        <label>
            <input type="checkbox" value="Vue.js" v-model="skills">
            Vue.js
        </label>

        <p>
            学習頻度：
            <select v-model="frequency">
                <option value="">選択してください</option>
                <option value="毎日">毎日</option>
                <option value="週3〜4回">週3〜4回</option>
                <option value="週1〜2回">週1〜2回</option>
                <option value="月数回">月数回</option>
            </select>
        </p>

        <p>
            コメント：
            <textarea v-model="comment"></textarea>
        </p>

        <hr>

        <h2>入力内容</h2>

        <p>名前：{{ name }}</p>
        <p>年齢：{{ age }}</p>
        <p>性別：{{ gender }}</p>
        <p>興味のある分野：{{ skills.join("、") }}</p>
        <p>学習頻度：{{ frequency }}</p>
        <p>コメント：{{ comment }}</p>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="script.js"></script>
</body>

</html>
